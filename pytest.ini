[pytest]
testpaths = tests
# EL CINTURON DE LA KEY (doctrina de la casa): una corrida pelada de `pytest` JAMAS toca la red
# ni gasta una key de nadie. En este repo TODA la suite cumple eso —el cliente de embeddings es
# un doble, el grafo son dos funciones y los PDF se generan en el test— asi que hoy el filtro no
# deselecciona nada. Los markers se declaran igual, por dos razones: un test que manana hable con
# un proveedor o con un Neo4j de verdad tiene donde ponerse sin volverse el default, y quien lo
# escriba encuentra la regla escrita en vez de inventarla.
addopts = -q -m "not integration and not neo4j"
markers =
    integration: llama a proveedores reales (embeddings, LLM). Correr con: pytest -m integration
    neo4j: necesita un Neo4j vivo. Que sea uno de PRUEBA (docker-compose.yml de este repo),
        nunca el grafo con el corpus: estos tests escriben y borran.
